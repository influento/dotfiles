# TanStack Start — the full-stack React framework. Scaffolded by its CLI into
# a fresh directory, so for a new project it runs before the scaffold commit;
# no DEP, the scaffold brings its own.
KIND=lib
NEEDS="effect atom-react"
SETUP="npx @tanstack/cli create <app> --blank   (new directory; --target-dir . --force into this one)"
NOTE="TanStack Start: file routes under src/routes/, business logic as Effect RPC served from one API route, client through AtomRpc; no server functions for logic, no TanStack Query."
