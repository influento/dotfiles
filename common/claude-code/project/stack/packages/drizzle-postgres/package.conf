# Drizzle ORM on Effect — drizzle-orm 1.0 ships its own Effect v4 entry
# (drizzle-orm/effect-postgres over @effect/sql-pg); @effect/sql-drizzle is
# the v3 path and is not used. Postgres only, decided; other dialects have the
# same entries (effect-mysql2, effect-sqlite-node, effect-d1, effect-libsql).
# The pin is a hash build: the tagged 1.0.0-rc.4 is compiled against Effect
# 4.0.0-beta.83 and dies at import on rc.115 (`Schema.TaggedErrorClass is not
# a function`); the rc.5 builds target beta.105 and call `Schema.TaggedError`,
# which rc.115 has. Verified against a real Postgres 2026-09-12.
KIND=lib
NEEDS=effect
DEP="drizzle-orm@1.0.0-rc.5-5935859 @effect/sql-pg@4.0.0-rc.115"
DEV_DEP="drizzle-kit@1.0.0-rc.4"
NOTE="Drizzle ORM through drizzle-orm/effect-postgres over @effect/sql-pg: Db service in src/db/db.ts, tables in src/db/schema.ts, migrations generated by drizzle-kit and applied by src/db/migrate.ts."
