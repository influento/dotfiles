# shadcn/ui — components copied into the project by its CLI, not a dependency.
# No REFERENCE: the skill carries the docs and reads components.json live.
KIND=lib
DEP=
SKILLS_ADD=shadcn/ui
SKILLS_PICK=shadcn
SETUP="npx shadcn@latest init"
NOTE="shadcn/ui components, added with its CLI into components/ui; the shadcn skill fires on components.json."
