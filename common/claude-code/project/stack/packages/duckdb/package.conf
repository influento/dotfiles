# @duckdb/node-api — DuckDB's current Node client ("node-neo"; the older
# `duckdb` package is not installed): in-process analytical SQL over files
# (Parquet, CSV, JSON) and a local database file. Not a Drizzle target and
# not the app database: that is the SQL database reached through
# drizzle-<dialect>; DuckDB is for analytics and local data. Promise-based with an explicit instance/connection lifecycle,
# so wrapped once behind an Effect service with a Scope (rule). The version
# is <duckdb release>-r.<client revision>. No REFERENCE: the package README
# is the whole API.
KIND=lib
NEEDS=effect
DEP="@duckdb/node-api@1.5.5-r.4"
NOTE="Analytical SQL with @duckdb/node-api, wrapped once in a Duck service (src/duck/duck.ts): one DuckDBInstance in a scoped layer, a connection per Effect, results read with getRowObjects/getColumnsObject."
