# Grafana, Honeycomb) consumes OTLP, so no vendor SDK and no second logger.
KIND=lib
NEEDS=effect
DEP="@effect/opentelemetry@4.0.0-rc.115"
NOTE="Tracing and metrics through @effect/opentelemetry, one layer in main; spans from Effect.withSpan, logs from Effect.log*; no vendor SDK."
