# A full-stack app: the runtime plus TanStack Start, atom-react, shadcn. The
# database is not in it: the dialect is the project's choice, added beside
# it as drizzle-<dialect> (project-setup asks).
# Auth: none in the registry (Better Auth dropped 2026-09-12, no Effect API planned); written per project when needed.
KIND=preset
NEEDS="effect tanstack-start atom-react shadcn"
NOTE="Preset: effect + tanstack-start, atom-react, shadcn; the database is a drizzle-<dialect> package beside it."
