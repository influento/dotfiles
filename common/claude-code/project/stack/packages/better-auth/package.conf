# Better Auth — self-hosted auth over the stack's Postgres through its Drizzle
# adapter. No Effect API (better-auth/better-auth#7338 is open), so it is
# wrapped once behind an Auth service; the rule says where.
KIND=lib
NEEDS="effect drizzle"
REFERENCE=git:https://github.com/better-auth/better-auth.git
REF=v1.7.4
DEP="better-auth@1.7.4 @better-auth/drizzle-adapter@1.7.4"
NOTE="Better Auth, wrapped once in src/auth/ behind an Auth service and a CurrentUser middleware; docs in repos/better-auth/docs/content/docs/."
