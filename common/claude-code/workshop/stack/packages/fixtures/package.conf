# fixtures — recorded responses in place of the network, prebuilt. ts-gate
# refuses the network in tests, so a test reads a real response recorded once
# under fixtures/ and decoded through the wire Schema production uses; an
# invented object literal never stands in for a response. No dependency:
# Schema, Effect and Stream are in effect, the file IO is node:fs. Ships
# src/core/fixture.ts (load, stream, record) and the rule; the project writes
# the record scripts, which know its endpoints, and any replay driver.
# Compiled and run against effect 4.0.0-rc.115, 2026-09-13.
KIND=lib
NEEDS=effect
NOTE="Tests read recorded responses, never the network: Fixture.load / stream / record from src/core/fixture.ts over fixtures/<source>/<name>.json; recording is a script run once, its output evidence."
