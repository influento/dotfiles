# Tailwind CSS v4 — the styling layer, with or without shadcn/ui. No Tailwind
# Labs skill or llms.txt exists (declined 2026-01), and the skills.sh ones are
# long tutorials, so the rule carries only the v4 facts nothing enforces;
# @shadcn/lint (works on any Tailwind v4 project) enforces the rest through
# eslint.mjs, which ts-gate's eslint loads. tailwindcss itself comes from the
# scaffold (shadcn init, the framework's CLI), not pinned here.
KIND=lib
DEV_DEP=@shadcn/lint@0.1.0
NOTE="Tailwind CSS v4, tokens in @theme; @shadcn/lint checks the classes in ts-gate's eslint."
