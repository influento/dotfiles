# @jup-ag/api — Jupiter's generated client for the Swap API (quote, swap,
# swap-instructions); the one swap aggregator on Solana. Defaults to
# https://api.jup.ag/swap/v1, which needs an API key from portal.jup.ag;
# https://lite-api.jup.ag/swap/v1 is the keyless tier. fetch-based, wrapped
# once behind an Effect service (rule). No REFERENCE: the client is generated
# from the OpenAPI spec and its types are the docs.
KIND=lib
NEEDS="effect solana-kit"
DEP="@jup-ag/api@6.0.48"
NOTE="Jupiter swaps with @jup-ag/api, wrapped once in a Jupiter service (src/solana/jupiter.ts): quoteGet then swapPost or swapInstructionsPost, the transaction signed and sent through the Solana service."
