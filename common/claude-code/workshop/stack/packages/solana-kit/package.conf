# @solana/kit — Solana's current SDK (the successor to @solana/web3.js 1.x,
# which is not installed and whose API names no longer exist): RPC, RPC
# subscriptions, transaction messages, codecs, signers, all tree-shakeable
# functions. Promise-based, wrapped once behind an Effect service (rule).
# No REFERENCE: the per-package READMEs under node_modules/@solana/*/ are
# the docs.
KIND=lib
NEEDS=effect
DEP="@solana/kit@8.3.0"
NOTE="Solana with @solana/kit, wrapped once in a Solana service (src/solana/solana.ts): rpc + rpcSubscriptions from Config, transaction messages built with the pipe helpers, signed by a KeyPairSigner."
