# money — the money invariant, prebuilt: amounts are never a JS number. Chain
# units are branded bigints, prices and PnL branded Effect BigDecimals, both
# from Schema so the only way in is a decode at a boundary. No dependency:
# Schema.BigInt, Schema.BigDecimal and Schema.brand are in effect. Ships
# src/core/money.ts (the constructors; the project names its own units) and
# the rule; ts-gate turns its money lint on by itself when this package is
# in .claude/stack.conf. Compiled and run against effect 4.0.0-rc.115
# 2026-09-13.
KIND=lib
NEEDS=effect
NOTE="Money never as a number: branded bigint units and BigDecimal kinds from src/core/money.ts (Units, UnitsFromString, Decimal, DecimalFromString); the gate bans parseFloat, Number(), toNumber, toFixed."
