# TanStack Start — the full-stack React framework. Scaffolded by its CLI into
# a fresh directory, so for a new project it runs before the scaffold commit;
# no DEP, the scaffold brings its own. Wiring verified 2026-09-12 (rule.md).
KIND=lib
NEEDS="effect atom-react"
SETUP="npx @tanstack/cli create <app> --framework React --blank --package-manager npm --no-toolchain --no-intent --non-interactive   (new directory; --target-dir . --force into this one), then add src/start.ts"
NOTE="TanStack Start: file routes under src/routes/, business logic as Effect RPC served from src/routes/api/rpc.ts, loaders call it in-process on SSR and over HTTP in the browser, mutations through AtomRpc; no server functions for logic, no TanStack Query."
