# chains. No ethers, no web3.js. Promise-based, so wrapped once behind an
# Effect service (rule). No REFERENCE: the repository is 430 MB of site and
# fixtures; the types in node_modules and https://viem.sh/llms.txt are the docs.
KIND=lib
NEEDS=effect
DEP="viem@2.56.3"
NOTE="EVM chains with viem, wrapped once in an Evm service (src/evm/evm.ts): a PublicClient per chain, contracts through readContract/writeContract, ABIs as const."
